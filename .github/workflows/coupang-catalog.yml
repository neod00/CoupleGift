name: Coupang Product Catalog
on:
  schedule:
    # Every Sunday 21:00 UTC (Monday 06:00 KST) — refreshes keywords older than 14 days
    - cron: '0 21 * * 0'
  workflow_dispatch: # Allow manual trigger from GitHub UI
    inputs:
      force:
        description: 'Refetch every keyword (ignore 14-day freshness)'
        type: boolean
        default: false
      limit:
        description: 'Max keywords to fetch this run'
        type: string
        default: '10'
      delay:
        description: 'Milliseconds to wait between API calls'
        type: string
        default: '3000'

jobs:
  fetch-and-commit:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Coupang products
        # Exits 0 with a message when the keys are not configured, so CI never fails on missing secrets.
        # Stops early (without retrying) on 429 to protect the Partners account.
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ secrets.COUPANG_SUB_ID }}
        run: |
          ARGS="--limit ${{ github.event.inputs.limit || '10' }} --delay ${{ github.event.inputs.delay || '3000' }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          npx tsx scripts/fetch-coupang-products.ts $ARGS

      - name: Commit and Push catalog
        # Runs even if the fetch step failed part-way (e.g. auth error after some keywords) so partial progress is kept
        if: ${{ !cancelled() }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/coupang/products.json
          # Check if there are any changes to commit
          if git diff --staged --quiet; then
            echo "Catalog unchanged, nothing to commit"
          else
            git commit -m "chore(coupang): refresh product catalog 🛒"
            git push
          fi
