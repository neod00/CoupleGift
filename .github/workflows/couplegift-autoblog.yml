name: Auto Blog Publish
on:
  schedule:
    # Weekdays 00:00 UTC (09:00 KST) — one evergreen-keyword post per weekday
    - cron: '0 0 * * 1-5'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  generate-and-publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Auto Blog Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          npx tsx scripts/auto-blog-cron.ts

      - name: Fetch Coupang products for new keywords (optional)
        # Only runs when Partners API keys are configured; the script exits 0 without keys.
        # Small limit + long delay to stay under the reported hidden ~10 calls/hour cap.
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ secrets.COUPANG_SUB_ID }}
        run: |
          if [ -n "$COUPANG_ACCESS_KEY" ] && [ -n "$COUPANG_SECRET_KEY" ]; then
            npx tsx scripts/fetch-coupang-products.ts --limit 8 --delay 3000
          else
            echo "Coupang keys not configured — skipping product catalog fetch"
          fi

      - name: Commit and Push new post, keyword queue, and catalog
        if: ${{ !cancelled() }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/blog/posts/*.json src/data/blog/keywords.json src/data/coupang/products.json
          # Check if there are any changes to commit
          if git diff --staged --quiet; then
            echo "No new blog generated to commit"
          else
            git commit -m "chore(blog): auto-publish SEO blog via Gemini AI 🤖"
            git push
          fi
